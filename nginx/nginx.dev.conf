user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # claude 수정 (2026-11-22): 개발 서버 접근 제한 — DEV_ALLOWED_IPS(.env.dev)에 있는 출발 주소($remote_addr)만 허용, 나머지는 모든 경로 403.
        # 이 파일은 nginx 기동 시 nginx/dev-allowlist.sh 가 만든다. 없으면 nginx 가 뜨지 않는다(fail-closed).
        include /etc/nginx/dev_allowed_ips.conf;

        # API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # Django Admin
        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Admin / DRF static files only (dev: runserver가 직접 서빙)
        location /static/admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /static/rest_framework/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /media/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # React Frontend (SPA fallback) — /static/css, /static/js 등 React 빌드 파일 포함
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}
