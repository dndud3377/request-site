user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ===== 보안 응답 헤더 (docs/SECURITY.md M-15) =====
        # always: 4xx/5xx 응답에도 붙인다. 붙이지 않으면 에러 페이지에서 방어가 빠진다.
        # 주의: 하위 location 에서 add_header 를 하나라도 쓰면 이 블록이 상속되지 않는다.
        #       그래서 add_header 를 쓰는 location(/media/)에는 필요한 헤더를 다시 적어 둔다.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # CSP: 인라인 스타일은 화면 곳곳에서 style={{...}} 로 쓰고 있어 허용해야 한다.
        # 인라인 **스크립트**는 허용하지 않는다 - 저장형 XSS 의 마지막 방어선이다.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # 서버 버전 노출 최소화
        server_tokens off;

        # SSE (Server-Sent Events) - 버퍼링 비활성화 필수
        location /api/users/events/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        # API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90;
        }

        # Django Admin
        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # React Frontend Static
        location /static/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Django Static (API/Admin 정적파일)
        location /django-static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Django Media (사용자 업로드물)
        #
        # ⚠️ 업로드 파일은 "내려받는 것"이지 "여는 것"이 아니다. 업로드 검증(api/views.py)이
        #    1차 방어이고, 이 헤더가 2차 방어다 - 혹시 .html/.svg 가 저장되더라도
        #    브라우저가 실행하지 않고 내려받게 만든다. 상세: docs/SECURITY.md C-4 / M-15.
        #    이 location 은 add_header 를 쓰므로 server 블록의 헤더가 상속되지 않는다.
        #    필요한 헤더를 여기에 다시 적어 둔 이유다.
        location /media/ {
            alias /var/www/media/;
            expires 7d;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # React Frontend (SPA fallback)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}
