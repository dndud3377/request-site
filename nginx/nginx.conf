user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    # claude 수정 (2026-11-28): 접근 로그를 날짜별 파일로도 남긴다(응답시간 포함) — 호스트 ./logs/nginx, 30일 지난 파일은 scheduler 가 삭제(docs/LOGGING.md)
    # 날짜는 nginx 컨테이너의 로컬 시각 기준이다. 폴더는 docker-entrypoint.d/40-log-archive-dir.sh 가 만든다.
    log_format  archive  '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" rt=$request_time';
    map $time_iso8601 $log_date {
        "~^(?<ymd>\d{4}-\d{2}-\d{2})"  $ymd;
        default                           unknown;
    }
    open_log_file_cache max=10 inactive=60s valid=60s;
    access_log  /var/log/nginx-archive/access-$log_date.log  archive;
    # 경로에 변수가 있는 access_log 는 기록 전에 root 폴더 존재를 확인하고, 없으면 기록을 건너뛴다.
    # 기본값(/etc/nginx/html)은 이미지에 없으므로 있는 폴더를 지정한다 — 모든 location 이 proxy_pass/alias 라 응답에는 영향 없다.
    root  /usr/share/nginx/html;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90;
        }

        # Django Admin
        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # React Frontend Static
        location /static/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Django Static (API/Admin 정적파일)
        location /django-static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # claude 수정 (2026-10-23): 미디어는 Django 가 인증한 뒤 X-Accel-Redirect 로 넘기고, 파일 전송은 internal 경로가 맡는다 (B-34)
        # Django Media — 인증·확장자 검사는 api.views.serve_media
        location /media/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 외부에서 직접 접근 불가(internal). 경로는 settings.production.MEDIA_X_ACCEL_PREFIX 와 같아야 한다.
        location /protected-media/ {
            internal;
            alias /var/www/media/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
        }

        # React Frontend (SPA fallback)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}
