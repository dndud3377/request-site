# ── 개발 환경 (개인 PC에서 build·실행) ────────────────────────────────────────
# 실행: docker compose --env-file .env.dev -f docker-compose.dev.yml up --build
#
#   ${...} 치환값(IMAGE_PATH, CONTAINER_IMAGE, NPM_REGISTRY_URL, PIP_INDEX_URL 등)은
#   env_file 이 아니라 --env-file 로만 공급된다. env_file 은 컨테이너 안 환경변수 전용이다.
#   --env-file 을 빼면 같은 폴더의 운영용 .env 를 읽거나(운영 서버), .env 가 없으면
#   "service db has neither an image nor a build context" 로 실패한다(개인 PC).
#
# 상세 절차는 README.md 의 "개발 환경 (개인 PC)" 참조.
name: request-site-dev

services:
  db:
    image: ${CONTAINER_IMAGE}
    container_name: request_db_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./mysql/my.dev.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-sync:
    image: ${CONTAINER_IMAGE}
    env_file:
      - .env.dev
    # 개인 PC 개발환경은 운영 DB에 접속하지 않는 것이 기본값(SKIP_DB_SYNC=true)이다.
    # 운영 DB를 복사하려면 .env.dev 에 SKIP_DB_SYNC=false 와 PROD_MYSQL_HOST=<운영 VM IP> 를 지정한다.
    environment:
      SKIP_DB_SYNC: ${SKIP_DB_SYNC:-true}
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        echo '[DB Sync] Creating dev DB if not exists...';
        mysql -h $$MYSQL_HOST -u $$MYSQL_USER -p$$MYSQL_PASSWORD -e 'CREATE DATABASE IF NOT EXISTS \`'$$MYSQL_DB'\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;';
        if [ \"$$SKIP_DB_SYNC\" = 'true' ]; then
          echo '[DB Sync] Data sync skipped (SKIP_DB_SYNC=true)';
          exit 0;
        fi;
        echo '[DB Sync] Copying prod → dev...';
        set -eo pipefail;
        mysqldump -h $$PROD_MYSQL_HOST -u $$MYSQL_USER -p$$MYSQL_PASSWORD --single-transaction --skip-lock-tables --ignore-table=$$PROD_MYSQL_DB.django_apscheduler_djangojob --ignore-table=$$PROD_MYSQL_DB.django_apscheduler_djangojobexecution $$PROD_MYSQL_DB |
          mysql -h $$MYSQL_HOST -u $$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DB;
        echo '[DB Sync] Done.';
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        IMAGE_PATH: ${IMAGE_PATH}
        PIP_INDEX_URL: ${PIP_INDEX_URL}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST}
        BIGDATA_INDEX_URL: ${BIGDATA_INDEX_URL}
        BIGDATA_TRUSTED_HOST: ${BIGDATA_TRUSTED_HOST}
        ODBC_DRIVER_URL: ${ODBC_DRIVER_URL}
        ODBC_DRIVER_FILENAME: ${ODBC_DRIVER_FILENAME}
    image: request-site-backend-dev:latest
    container_name: request_backend_dev
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - AUTH_MODE=dev
      - DEBUG=True
      - SKIP_SCHEDULER=true
    volumes:
      - ./backend:/app
    depends_on:
      db-sync:
        condition: service_completed_successfully
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate --noinput &&
             python manage.py create_users &&
             python manage.py seed_lines &&
             python manage.py runserver 0.0.0.0:8000"

  # dev 스케줄러 전용 단일 프로세스. dev 는 SKIP_SCHEDULER=true 이므로
  # 무거운 DCQ/RTDB 동기화는 건너뛰고 결재 알림 메일 큐 발송만 실행한다.
  scheduler:
    image: request-site-backend-dev:latest
    container_name: request_scheduler_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - SKIP_SCHEDULER=true
    volumes:
      - ./backend:/app
    depends_on:
      db-sync:
        condition: service_completed_successfully
      backend:
        condition: service_started
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py run_scheduler"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        IMAGE_PATH: ${IMAGE_PATH}
        NPM_REGISTRY_URL: ${NPM_REGISTRY_URL}
        REACT_APP_AUTH_MODE: "dev"
    container_name: request_frontend_dev
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        IMAGE_PATH: ${IMAGE_PATH}
    container_name: request_nginx_dev
    restart: unless-stopped
    ports:
      - "10011:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend

volumes:
  mysql_dev_data:

networks:
  default: {}
